name: SNAP Build/Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  # Triggered on push by .github/workflows/release.yaml
  workflow_call:
    outputs:
      artifact-prefix:
        description: build_snap.yaml `artifact-prefix` output
        value: ${{ jobs.build.outputs.artifact-prefix }}

jobs:
  lint-workflows:
    name: Lint .github/workflows/
    uses: canonical/data-platform-workflows/.github/workflows/lint_workflows.yaml@v53.0.0
    permissions:
      contents: read
    cache-mode: none

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install tox & poetry
        run: |
          pipx install tox
          pipx install poetry
      - name: tox run -e lint
        run: tox run -e lint
    permissions: {}
    cache-mode: none

  build:
    name: Build snap
    uses: canonical/data-platform-workflows/.github/workflows/build_snap.yaml@v53.0.0
    with:
      # Compiling the server takes ~60-70 min on a 4 vCPU hosted runner; the
      # reusable workflow's default is 30. `timeout-minutes` is not allowed on
      # a job that calls a reusable workflow (GitHub rejects the whole file).
      build-timeout: 120
    permissions:
      contents: read
    cache-mode: none

  build-riscv64:
    name: Build snap | riscv64
    # build_snap.yaml has no runner for riscv64 (amd64, arm64, s390x only), so
    # this job builds it on the free RISE RISC-V Runners
    # (https://riscv-runners.riseproject.dev/): an ephemeral pod on a shared
    # Scaleway EM-RV1 node with Docker but no snapd, LXD or virtualization.
    # The snap is therefore packed with snapcraft from pip in destructive mode
    # inside an Ubuntu 26.04 container (the core26 build base). The artifact
    # name matches build_snap.yaml's, so release.yaml picks it up with the
    # other architectures. No spread run: riscv64 is tested by hand.
    runs-on: ubuntu-24.04-riscv
    # Compiling the server on the EM-RV1 is expected to take several hours.
    timeout-minutes: 720
    # Only for the release dispatch, or a pull request from this repository
    # labelled `riscv64`, to keep the shared runners free for the common case.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'riscv64'))
    needs:
      - lint-workflows
      - lint
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Pack in an Ubuntu 26.04 container (core26 build base)
        run: |
          docker run --rm --volume "${PWD}:/project" --workdir /project \
            ubuntu:26.04 bash -ec '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends \
              ca-certificates git python3-pip python3-apt squashfs-tools
            pip install --break-system-packages snapcraft
            snapcraft pack --destructive-mode --platform riscv64 \
              --verbosity brief
          '
          ls -l ./*.snap
      - name: Upload snap package
        uses: actions/upload-artifact@v7
        with:
          # build_snap.yaml pattern: <prefix>-<path>--platform-<arch>
          name: packed-snap-.--platform-riscv64
          path: "*.snap"
          if-no-files-found: error
    permissions:
      contents: read
    cache-mode: none

  test:
    name: Test snap | ${{ matrix.base.version }} ${{ matrix.platform.arch }}
    # `snapcraft test` runs the whole suite on three systems: ~16 min on 12
    # cores, several times that on a 4 vCPU runner.
    timeout-minutes: 120
    # runs-on: [self-hosted, linux, "${{ matrix.platform.host_arch }}", "${{ matrix.base.codename }}", large]
    runs-on: "ubuntu-${{ matrix.base.version }}${{ matrix.platform.gh_suffix }}"
    strategy:
      fail-fast: false
      matrix:
        base:
          - { codename: jammy, version: 22.04 }
          - { codename: noble, version: 24.04 }
        # - { codename: resolute, version: 26.04 }
        platform:
          - { os: linux, arch: amd64, host_arch: x64, gh_suffix: "" }
          - { os: linux, arch: arm64, host_arch: arm64, gh_suffix: "-arm" }
    needs:
      - lint-workflows
      - lint
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download snap package(s)
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ needs.build.outputs.artifact-prefix }}-*-${{ matrix.platform.arch }}
          merge-multiple: true
      - name: Add pipx to PATH
        run: |
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          echo "/root/.local/bin" >> "${GITHUB_PATH}"
      - name: Run tests
        run: |
          # lxd is necessary for spread
          sudo snap install lxd
          # On ubuntu-22.04 runner, lxd 5.0 is installed. lxd 5.21 is needed for core26 for https://github.com/canonical/lxd/pull/17409
          sudo snap refresh lxd --channel 5.21/stable
          sudo adduser "$USER" lxd
          # `newgrp` does not work in GitHub Actions; use `sudo --user` instead
          sudo --user "$USER" --preserve-env --preserve-env=PATH -- env -- lxd waitready
          sudo --user "$USER" --preserve-env --preserve-env=PATH -- env -- lxd init --auto
          # Workaround for Docker & LXD on same machine
          sudo iptables -F FORWARD
          sudo iptables -P FORWARD ACCEPT
          sudo snap install snapcraft --classic
          # Extension snaps used by the extension_snap_* spread tests
          for ext in extensions/*/; do
            (cd "$ext" && sudo --user "$USER" --preserve-env --preserve-env=PATH -- env -- snapcraft pack)
          done
          sudo --user "$USER" --preserve-env --preserve-env=PATH -- env -- snapcraft test
    permissions: {}
    cache-mode: none

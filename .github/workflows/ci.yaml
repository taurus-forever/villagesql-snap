name: SNAP Build/Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  # Triggered on push by .github/workflows/release.yaml
  workflow_call:
    outputs:
      artifact-prefix:
        description: build_snap.yaml `artifact-prefix` output
        value: ${{ jobs.build.outputs.artifact-prefix }}
      extension-artifact-prefix:
        description: Prefix of the extension (provider) snap artifacts
        value: packed-extension

jobs:
  lint-workflows:
    name: Lint .github/workflows/
    uses: canonical/data-platform-workflows/.github/workflows/lint_workflows.yaml@v53.0.0
    permissions:
      contents: read
    cache-mode: none

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install tox & poetry
        run: |
          pipx install tox
          pipx install poetry
      - name: tox run -e lint
        run: tox run -e lint
    permissions: {}
    cache-mode: none

  build:
    name: Build snap
    uses: canonical/data-platform-workflows/.github/workflows/build_snap.yaml@v53.0.0
    with:
      # Compiling the server takes ~60-70 min on a 4 vCPU hosted runner; the
      # reusable workflow's default is 30. `timeout-minutes` is not allowed on
      # a job that calls a reusable workflow (GitHub rejects the whole file).
      build-timeout: 120
    permissions:
      contents: read
    cache-mode: none

  list-extensions:
    name: List extension snaps
    # The build matrix is the directory tree, so a new provider directory
    # cannot be left out of the build.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      extensions: ${{ steps.list.outputs.extensions }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: List extensions/ directories as JSON
        id: list
        run: |
          list="$(ls -d extensions/*/ | xargs -n1 basename | jq -R . | jq -sc .)"
          echo "$list"
          echo "extensions=$list" >> "$GITHUB_OUTPUT"
    permissions: {}
    cache-mode: none

  build-extensions:
    name: Build extension snap | ${{ matrix.extension }}
    needs:
      - list-extensions
    uses: canonical/data-platform-workflows/.github/workflows/build_snap.yaml@v53.0.0
    strategy:
      fail-fast: false
      matrix:
        extension: ${{ fromJSON(needs.list-extensions.outputs.extensions) }}
    with:
      path-to-snap-project-directory: extensions/${{ matrix.extension }}
      artifact-prefix: packed-extension
      # A C++ provider packs in minutes; the Rust ones compile their
      # dependency tree; villagesql-duckdb clones and builds DuckDB itself.
      build-timeout: ${{ matrix.extension == 'villagesql-duckdb' && 300 || 60 }}
    permissions:
      contents: read
    cache-mode: none

  test:
    name: Test snap | ${{ matrix.base.version }} ${{ matrix.platform.arch }}
    # `snapcraft test` runs the whole suite on three systems: ~16 min on 12
    # cores, several times that on a 4 vCPU runner.
    timeout-minutes: 120
    # runs-on: [self-hosted, linux, "${{ matrix.platform.host_arch }}", "${{ matrix.base.codename }}", large]
    runs-on: "ubuntu-${{ matrix.base.version }}${{ matrix.platform.gh_suffix }}"
    strategy:
      fail-fast: false
      matrix:
        base:
          - { codename: jammy, version: 22.04 }
          - { codename: noble, version: 24.04 }
        # - { codename: resolute, version: 26.04 }
        platform:
          - { os: linux, arch: amd64, host_arch: x64, gh_suffix: "" }
          - { os: linux, arch: arm64, host_arch: arm64, gh_suffix: "-arm" }
    needs:
      - lint-workflows
      - lint
      - build
      - build-extensions
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download snap package(s)
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ needs.build.outputs.artifact-prefix }}-*-${{ matrix.platform.arch }}
          merge-multiple: true
      - name: Download extension snap(s)
        uses: actions/download-artifact@v8
        with:
          pattern: packed-extension-*--platform-${{ matrix.platform.arch }}
          path: extension-artifacts
      - name: Place extension snaps next to their projects
        # The extension_snap* spread tests pick them up from extensions/<name>/
        run: |
          for f in extension-artifacts/*/*.snap; do
            name="$(basename "$f")"
            name="${name%%_*}"
            mv "$f" "extensions/$name/"
          done
          ls -l extensions/*/*.snap
      - name: Add pipx to PATH
        run: |
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          echo "/root/.local/bin" >> "${GITHUB_PATH}"
      - name: Run tests
        run: |
          # lxd is necessary for spread
          sudo snap install lxd
          # On ubuntu-22.04 runner, lxd 5.0 is installed. lxd 5.21 is needed for core26 for https://github.com/canonical/lxd/pull/17409
          sudo snap refresh lxd --channel 5.21/stable
          sudo adduser "$USER" lxd
          # `newgrp` does not work in GitHub Actions; use `sudo --user` instead
          sudo --user "$USER" --preserve-env --preserve-env=PATH -- env -- lxd waitready
          sudo --user "$USER" --preserve-env --preserve-env=PATH -- env -- lxd init --auto
          # Workaround for Docker & LXD on same machine
          sudo iptables -F FORWARD
          sudo iptables -P FORWARD ACCEPT
          sudo snap install snapcraft --classic
          sudo --user "$USER" --preserve-env --preserve-env=PATH -- env -- snapcraft test
    permissions: {}
    cache-mode: none

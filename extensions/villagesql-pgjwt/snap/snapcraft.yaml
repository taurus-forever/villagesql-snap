name: villagesql-pgjwt
base: core26
version: '0.0.1+gitfd2e02d'
summary: vsql_pgjwt extension for the VillageSQL snap (content interface)
description: |
  Packages the upstream vsql-pgjwt extension (signing, verifying and
  decoding JWTs in SQL (pgjwt port)) as a separate snap that plugs into the
  villagesql snap through the content interface:

    sudo snap install villagesql-pgjwt
    sudo snap connect villagesql:extensions villagesql-pgjwt:extensions
    sudo snap restart villagesql
    sudo villagesql.mysql -uroot -e "INSTALL EXTENSION vsql_pgjwt;"
    sudo villagesql.mysql -uroot \
      -e "SELECT vsql_pgjwt.jwt_sign('{"sub":"u"}', 's', 'HS256');"
grade: devel
confinement: strict

platforms:
  amd64:
  arm64:
  riscv64:

slots:
  extensions:
    interface: content
    content: villagesql-extensions
    source:
      read:
        - $SNAP/pgjwt

parts:
  pgjwt:
    plugin: nil
    source: https://github.com/intojhanurag/vsql-pgjwt.git
    # The repository has no tags: pinned to the commit of 2026-10-21.
    source-commit: fd2e02d148670ba007c2bb50abf76e894d74ae3a
    build-packages:
      - build-essential
      - ca-certificates
      - cmake
      - curl
      - libssl-dev
    override-build: |
      set -e
      SDK_VERSION=0.0.7
      SDK_URL="https://github.com/villagesql/villagesql-server/releases"
      SDK_URL="$SDK_URL/download/release%2F${SDK_VERSION}"
      SDK_URL="$SDK_URL/villagesql-extension-sdk-${SDK_VERSION}.tar.gz"
      rm -rf sdk build && mkdir -p sdk
      curl -fsSL "$SDK_URL" | tar xz -C sdk --strip-components=1
      cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
        -DVillageSQL_SDK_DIR="$PWD/sdk"
      cmake --build build
      BUNDLE=vsql_pgjwt
      tar -tf "build/$BUNDLE.veb"
      # Layout consumed by the villagesql snap, see docs/extensions.md.
      OUT="$CRAFT_PART_INSTALL/pgjwt"
      install -Dm644 "build/$BUNDLE.veb" "$OUT/veb/$BUNDLE.veb"
      printf 'VERSION=%s\n' "$CRAFT_PROJECT_VERSION" > "$OUT/manifest"
      install -Dm644 LICENSE "$OUT/licenses/LICENSE-$CRAFT_PROJECT_NAME"

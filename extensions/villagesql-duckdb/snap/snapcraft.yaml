name: villagesql-duckdb
base: core26
version: '0.0.3'
summary: vsql_duckdb extension for the VillageSQL snap (content interface)
description: |
  Packages the upstream vsql-duckdb extension (an embedded DuckDB that runs
  queries over Parquet, CSV and JSON files, local or in object storage, from
  SQL) as a separate snap that plugs into the villagesql snap through the
  content interface:

    sudo snap install villagesql-duckdb
    sudo snap connect villagesql:extensions villagesql-duckdb:extensions
    sudo snap set villagesql vsql-allow-preview-extensions=ON
    sudo snap restart villagesql
    sudo villagesql.mysql -uroot \
      -e "INSTALL EXTENSION vsql_duckdb; SELECT duckdb_status();"

  Preview extension: it uses VEF APIs that may change between VillageSQL
  releases and only loads when the server runs with
  vsql_allow_preview_extensions=ON. Queries over https:// or s3:// need the
  villagesql snap's network access.

  The build clones and compiles DuckDB (v1.5.5, httpfs and json readers)
  itself: about 30 minutes on 12 cores (2026-10-21, shared with another build).
grade: devel
confinement: strict

platforms:
  amd64:
  arm64:
  riscv64:

slots:
  extensions:
    interface: content
    content: villagesql-extensions
    source:
      read:
        - $SNAP/duckdb

parts:
  duckdb:
    plugin: nil
    source: https://github.com/villagesql/vsql-duckdb.git
    source-tag: '0.0.3'
    source-depth: 1
    build-packages:
      - build-essential
      - ca-certificates
      - cmake
      - curl
      - git
      - libcurl4-openssl-dev
      - libssl-dev
      - ninja-build
    override-build: |
      set -e
      SDK_VERSION=0.0.7
      SDK_URL="https://github.com/villagesql/villagesql-server/releases"
      SDK_URL="$SDK_URL/download/release%2F${SDK_VERSION}"
      SDK_URL="$SDK_URL/villagesql-extension-sdk-${SDK_VERSION}.tar.gz"
      rm -rf sdk build && mkdir -p sdk
      curl -fsSL "$SDK_URL" | tar xz -C sdk --strip-components=1
      # DUCKDB_TAG and DUCKDB_READERS keep upstream's defaults (v1.5.5,
      # httpfs;json): the extension's loader is generated for exactly them.
      cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
        -DVillageSQL_SDK_DIR="$PWD/sdk"
      cmake --build build
      tar -tf build/vsql_duckdb.veb
      # Layout consumed by the villagesql snap, see docs/extensions.md.
      # libcurl and libssl are provided by the villagesql snap that loads it.
      OUT="$CRAFT_PART_INSTALL/duckdb"
      install -Dm644 build/vsql_duckdb.veb "$OUT/veb/vsql_duckdb.veb"
      printf 'VERSION=%s\n' "$CRAFT_PROJECT_VERSION" > "$OUT/manifest"
      install -Dm644 LICENSE "$OUT/licenses/LICENSE-villagesql-duckdb"

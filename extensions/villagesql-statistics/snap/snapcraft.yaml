name: villagesql-statistics
base: core26
version: '0.5.0'
summary: vsql_statistics extension for the VillageSQL snap (content interface)
description: |
  Packages the upstream vsql-statistics extension (statistical aggregates
  and tests (IQR, t-test, mode, skewness, kurtosis, ANOVA, ...) returned as
  JSON, by Ronald Bradford) as a separate snap that plugs into the
  villagesql snap through the content interface:

    sudo snap install villagesql-statistics
    sudo snap connect villagesql:extensions villagesql-statistics:extensions
    sudo snap restart villagesql
    sudo villagesql.mysql -uroot \
      -e "INSTALL EXTENSION vsql_statistics;"

  The upstream tag is v.0.3; the bundle's manifest says 0.5.0 and the snap version follows the manifest.
grade: devel
confinement: strict

platforms:
  amd64:
  arm64:
  riscv64:

slots:
  extensions:
    interface: content
    content: villagesql-extensions
    source:
      read:
        - $SNAP/statistics

parts:
  statistics:
    plugin: nil
    source: https://github.com/ronaldbradford/vsql-statistics.git
    source-tag: 'v.0.3'
    source-depth: 1
    build-packages:
      - build-essential
      - ca-certificates
      - cmake
      - curl
    override-build: |
      set -e
      SDK_VERSION=0.0.7
      SDK_URL="https://github.com/villagesql/villagesql-server/releases"
      SDK_URL="$SDK_URL/download/release%2F${SDK_VERSION}"
      SDK_URL="$SDK_URL/villagesql-extension-sdk-${SDK_VERSION}.tar.gz"
      rm -rf sdk build && mkdir -p sdk
      curl -fsSL "$SDK_URL" | tar xz -C sdk --strip-components=1
      cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
        -DVillageSQL_SDK_DIR="$PWD/sdk"
      cmake --build build
      tar -tf build/vsql_statistics.veb
      # Layout consumed by the villagesql snap, see docs/extensions.md.
      OUT="$CRAFT_PART_INSTALL/statistics"
      install -Dm644 build/vsql_statistics.veb "$OUT/veb/vsql_statistics.veb"
      printf 'VERSION=%s\n' "$CRAFT_PROJECT_VERSION" > "$OUT/manifest"
      install -Dm644 LICENSE "$OUT/licenses/LICENSE-villagesql-statistics"

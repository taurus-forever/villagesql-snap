name: villagesql-luhn
base: core26
version: '0.0.1+gitde5afe2'
summary: vsql_luhn extension for the VillageSQL snap (content interface)
description: |
  Packages the upstream vsql-luhn extension (Luhn check-digit validation and
  generation) as a separate snap that plugs into the villagesql snap through
  the content interface:

    sudo snap install villagesql-luhn
    sudo snap connect villagesql:extensions villagesql-luhn:extensions
    sudo snap restart villagesql
    sudo villagesql.mysql -uroot \
      -e "INSTALL EXTENSION vsql_luhn; SELECT vsql_luhn.luhn_valid('4539148803436467');"
grade: devel
confinement: strict

platforms:
  amd64:
  arm64:
  riscv64:

slots:
  extensions:
    interface: content
    content: villagesql-extensions
    source:
      read:
        - $SNAP/luhn

parts:
  luhn:
    plugin: nil
    source: https://github.com/intojhanurag/vsql-luhn.git
    # The repository has no tags: pinned to the commit of 2026-10-21.
    source-commit: de5afe2af69d21c420c0e12102b937accef54168
    build-packages:
      - build-essential
      - ca-certificates
      - cmake
      - curl
    override-build: |
      set -e
      SDK_VERSION=0.0.7
      SDK_URL="https://github.com/villagesql/villagesql-server/releases"
      SDK_URL="$SDK_URL/download/release%2F${SDK_VERSION}"
      SDK_URL="$SDK_URL/villagesql-extension-sdk-${SDK_VERSION}.tar.gz"
      rm -rf sdk build && mkdir -p sdk
      curl -fsSL "$SDK_URL" | tar xz -C sdk --strip-components=1
      cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
        -DVillageSQL_SDK_DIR="$PWD/sdk"
      cmake --build build
      tar -tf build/vsql_luhn.veb
      # Layout consumed by the villagesql snap, see docs/extensions.md.
      OUT="$CRAFT_PART_INSTALL/luhn"
      install -Dm644 build/vsql_luhn.veb "$OUT/veb/vsql_luhn.veb"
      printf 'VERSION=%s\n' "$CRAFT_PROJECT_VERSION" > "$OUT/manifest"
      install -Dm644 LICENSE "$OUT/licenses/LICENSE-villagesql-luhn"

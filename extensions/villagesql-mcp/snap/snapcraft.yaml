name: villagesql-mcp
base: core26
version: '0.0.7'
summary: vsql_mcp extension for the VillageSQL snap (content interface)
description: |
  Packages the upstream vsql-mcp extension (a Model Context Protocol (MCP)
  server that exposes a database to AI agents) as a separate snap that plugs
  into the villagesql snap through the content interface:

    sudo snap install villagesql-mcp
    sudo snap connect villagesql:extensions villagesql-mcp:extensions
    sudo snap set villagesql vsql-allow-preview-extensions=ON
    sudo snap restart villagesql
    sudo villagesql.mysql -uroot -e "INSTALL EXTENSION vsql_mcp;"
    sudo villagesql.mysql -uroot \
      -e "SELECT @@vsql_mcp.vsql_mcp_enabled;"

  Preview extension: it uses VEF APIs that may change between VillageSQL
  releases and only loads when the server runs with
  vsql_allow_preview_extensions=ON.

  Written in Rust against the VillageSQL Rust SDK (crates.io) and packaged
  with cargo-vsql; no server build is needed.
grade: devel
confinement: strict

platforms:
  amd64:
  arm64:
  riscv64:

slots:
  extensions:
    interface: content
    content: villagesql-extensions
    source:
      read:
        - $SNAP/mcp

parts:
  mcp:
    plugin: nil
    source: https://github.com/villagesql/vsql-mcp.git
    source-tag: '0.0.7'
    source-depth: 1
    build-snaps:
      - rustup
    build-packages:
      - build-essential
      - ca-certificates
      - libssl-dev
      - pkg-config
    override-build: |
      set -e
      rustup default stable
      cargo install cargo-vsql --locked --version 0.0.6
      # Upstream pins tiny_http 0.12 -> rustls 0.20 -> ring 0.16, and ring
      # 0.16 never got a riscv64 port: its build script panics on any target
      # outside x86/arm, and ChaCha20, P-256/P-384 and X25519 exist there
      # only as x86/arm assembly. rustls 0.21 keeps the API tiny_http and
      # vsql-mcp call (PrivateKey, Certificate, ServerConfig::builder,
      # sign::any_supported_type) and builds on ring 0.17, which supports
      # riscv64. Manifests only, no source changes; applied on every
      # architecture so CI builds and tests the tree riscv64 ships.
      cargo fetch
      TINY_HTTP="$(ls -d "$HOME/.cargo/registry/src/"*/tiny_http-0.12.0)"
      cp -a "$TINY_HTTP" vendor-tiny_http
      sed -i '/^\[dependencies\.rustls\]$/{n;s/^version = "0.20"$/version = "0.21"/}' \
        vendor-tiny_http/Cargo.toml
      grep -A1 '^\[dependencies\.rustls\]$' vendor-tiny_http/Cargo.toml | grep -q 'version = "0.21"'
      sed -i 's/^rustls = "0.20"$/rustls = "0.21"/' Cargo.toml
      # rustls 0.20 turned on webpki's std feature for the whole tree (that
      # is where vsql-mcp's RSA signature algorithms come from); rustls 0.21
      # uses rustls-webpki instead, so name the feature.
      sed -i 's/^webpki = "0.22"$/webpki = { version = "0.22", features = ["std"] }/' Cargo.toml
      grep -q '^rustls = "0.21"$' Cargo.toml
      grep -q '^webpki = { version = "0.22", features = \["std"\] }$' Cargo.toml
      printf '\n[patch.crates-io]\ntiny_http = { path = "vendor-tiny_http" }\n' >> Cargo.toml
      cargo update -p rustls --precise 0.21.12
      if grep -A1 '^name = "ring"$' Cargo.lock | grep -q 'version = "0.16'; then
        echo "ring 0.16 is still in Cargo.lock; it does not build on riscv64" >&2
        exit 1
      fi
      # Release build; writes dist/vsql_mcp.veb (manifest.json plus
      # lib/vsql_mcp.so) without a server checkout.
      cargo vsql package
      tar -tf dist/vsql_mcp.veb
      # Layout consumed by the villagesql snap, see docs/extensions.md.
      OUT="$CRAFT_PART_INSTALL/mcp"
      install -Dm644 dist/vsql_mcp.veb "$OUT/veb/vsql_mcp.veb"
      printf 'VERSION=%s\n' "$CRAFT_PROJECT_VERSION" > "$OUT/manifest"
      install -Dm644 LICENSE "$OUT/licenses/LICENSE-villagesql-mcp"

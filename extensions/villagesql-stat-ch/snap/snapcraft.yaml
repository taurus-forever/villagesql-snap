name: villagesql-stat-ch
base: core26
version: '0.0.3'
summary: vsql_stat_ch extension for the VillageSQL snap (content interface)
description: |
  Packages the upstream vsql-stat-ch extension (per-statement telemetry
  streamed to ClickHouse over its native protocol or HTTP) as a separate
  snap that plugs into the villagesql snap through the content interface:

    sudo snap install villagesql-stat-ch
    sudo snap connect villagesql:extensions villagesql-stat-ch:extensions
    sudo snap set villagesql vsql-allow-preview-extensions=ON
    sudo snap restart villagesql
    sudo villagesql.mysql -uroot -e "INSTALL EXTENSION vsql_stat_ch;"
    sudo villagesql.mysql -uroot \
      -e "SELECT @@vsql_stat_ch.clickhouse_port;"

  Preview extension: it uses VEF APIs that may change between VillageSQL
  releases and only loads when the server runs with
  vsql_allow_preview_extensions=ON.
grade: devel
confinement: strict

platforms:
  amd64:
  arm64:
  riscv64:

slots:
  extensions:
    interface: content
    content: villagesql-extensions
    source:
      read:
        - $SNAP/stat-ch

parts:
  stat-ch:
    plugin: nil
    source: https://github.com/villagesql/vsql-stat-ch.git
    source-tag: '0.0.3'
    source-depth: 1
    source-submodules:
      - core
      - third_party/clickhouse-c
    build-packages:
      - build-essential
      - ca-certificates
      - cmake
      - curl
      - libcurl4-openssl-dev
      - liblz4-dev
      - libzstd-dev
      - pkg-config
    override-build: |
      set -e
      SDK_VERSION=0.0.7
      SDK_URL="https://github.com/villagesql/villagesql-server/releases"
      SDK_URL="$SDK_URL/download/release%2F${SDK_VERSION}"
      SDK_URL="$SDK_URL/villagesql-extension-sdk-${SDK_VERSION}.tar.gz"
      rm -rf sdk build && mkdir -p sdk
      curl -fsSL "$SDK_URL" | tar xz -C sdk --strip-components=1
      cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
        -DVillageSQL_SDK_DIR="$PWD/sdk"
      cmake --build build
      BUNDLE=vsql_stat_ch
      tar -tf "build/$BUNDLE.veb"
      # Layout consumed by the villagesql snap, see docs/extensions.md.
      # libcurl, lz4 and zstd are provided by the villagesql snap that loads
      # the bundle.
      OUT="$CRAFT_PART_INSTALL/stat-ch"
      install -Dm644 "build/$BUNDLE.veb" "$OUT/veb/$BUNDLE.veb"
      printf 'VERSION=%s\n' "$CRAFT_PROJECT_VERSION" > "$OUT/manifest"
      install -Dm644 LICENSE "$OUT/licenses/LICENSE-$CRAFT_PROJECT_NAME"

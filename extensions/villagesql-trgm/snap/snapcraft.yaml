name: villagesql-trgm
base: core26
version: '0.0.4'
summary: vsql_trgm extension for the VillageSQL snap (content interface)
description: |
  Packages the upstream vsql-trgm extension (trigram-based text similarity
  search (pg_trgm port)) as a separate snap that plugs into the villagesql
  snap through the content interface:

    sudo snap install villagesql-trgm
    sudo snap connect villagesql:extensions villagesql-trgm:extensions
    sudo snap restart villagesql
    sudo villagesql.mysql -uroot \
      -e "INSTALL EXTENSION vsql_trgm; SELECT vsql_trgm.trgm_similarity('cat', 'car');"
grade: devel
confinement: strict

platforms:
  amd64:
  arm64:
  riscv64:

slots:
  extensions:
    interface: content
    content: villagesql-extensions
    source:
      read:
        - $SNAP/trgm

parts:
  trgm:
    plugin: nil
    source: https://github.com/villagesql/vsql-trgm.git
    source-tag: '0.0.4'
    source-depth: 1
    build-packages:
      - build-essential
      - ca-certificates
      - cmake
      - curl
    override-build: |
      set -e
      SDK_VERSION=0.0.7
      SDK_URL="https://github.com/villagesql/villagesql-server/releases"
      SDK_URL="$SDK_URL/download/release%2F${SDK_VERSION}"
      SDK_URL="$SDK_URL/villagesql-extension-sdk-${SDK_VERSION}.tar.gz"
      rm -rf sdk build && mkdir -p sdk
      curl -fsSL "$SDK_URL" | tar xz -C sdk --strip-components=1
      cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
        -DVillageSQL_SDK_DIR="$PWD/sdk"
      cmake --build build
      tar -tf build/vsql_trgm.veb
      # Layout consumed by the villagesql snap, see docs/extensions.md.
      OUT="$CRAFT_PART_INSTALL/trgm"
      install -Dm644 build/vsql_trgm.veb "$OUT/veb/vsql_trgm.veb"
      printf 'VERSION=%s\n' "$CRAFT_PROJECT_VERSION" > "$OUT/manifest"
      install -Dm644 LICENSE "$OUT/licenses/LICENSE-villagesql-trgm"

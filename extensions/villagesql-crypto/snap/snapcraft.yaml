name: villagesql-crypto
base: core26
version: '0.0.7'
summary: vsql_crypto extension for the VillageSQL snap (content interface)
description: |
  Packages the upstream vsql-crypto extension (hashing, HMAC, AES
  encryption, password hashing and random data via OpenSSL) as a separate
  snap that plugs into the villagesql snap through the content interface:

    sudo snap install villagesql-crypto
    sudo snap connect villagesql:extensions villagesql-crypto:extensions
    sudo snap restart villagesql
    sudo villagesql.mysql -uroot \
      -e "INSTALL EXTENSION vsql_crypto; SELECT crypto_version();"
grade: devel
confinement: strict

platforms:
  amd64:
  arm64:
  riscv64:

slots:
  extensions:
    interface: content
    content: villagesql-extensions
    source:
      read:
        - $SNAP/crypto

parts:
  crypto:
    plugin: nil
    source: https://github.com/villagesql/vsql-crypto.git
    source-tag: '0.0.7'
    source-depth: 1
    build-packages:
      - build-essential
      - ca-certificates
      - cmake
      - curl
      - libssl-dev
    override-build: |
      set -e
      SDK_VERSION=0.0.7
      SDK_URL="https://github.com/villagesql/villagesql-server/releases"
      SDK_URL="$SDK_URL/download/release%2F${SDK_VERSION}"
      SDK_URL="$SDK_URL/villagesql-extension-sdk-${SDK_VERSION}.tar.gz"
      rm -rf sdk build && mkdir -p sdk
      curl -fsSL "$SDK_URL" | tar xz -C sdk --strip-components=1
      cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
        -DVillageSQL_SDK_DIR="$PWD/sdk"
      cmake --build build
      tar -tf build/vsql_crypto.veb
      # Layout consumed by the villagesql snap, see docs/extensions.md.
      # libcrypto is provided by the villagesql snap that loads the bundle.
      OUT="$CRAFT_PART_INSTALL/crypto"
      install -Dm644 build/vsql_crypto.veb "$OUT/veb/vsql_crypto.veb"
      printf 'VERSION=%s\n' "$CRAFT_PROJECT_VERSION" > "$OUT/manifest"
      install -Dm644 LICENSE "$OUT/licenses/LICENSE-villagesql-crypto"

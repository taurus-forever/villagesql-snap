name: villagesql-network-address
base: core26
version: '0.0.7'
summary: vsql_network_address extension for the VillageSQL snap (content interface)
description: |
  Packages the upstream vsql-network-address extension (INET, CIDR, MACADDR
  and MACADDR8 column types with their functions) as a separate snap that
  plugs into the villagesql snap through the content interface:

    sudo snap install villagesql-network-address
    sudo snap connect villagesql:extensions villagesql-network-address:extensions
    sudo snap restart villagesql
    sudo villagesql.mysql -uroot \
      -e "INSTALL EXTENSION vsql_network_address;"
grade: devel
confinement: strict

platforms:
  amd64:
  arm64:
  riscv64:

slots:
  extensions:
    interface: content
    content: villagesql-extensions
    source:
      read:
        - $SNAP/network-address

parts:
  network-address:
    plugin: nil
    source: https://github.com/villagesql/vsql-network-address.git
    source-tag: '0.0.7'
    source-depth: 1
    build-packages:
      - build-essential
      - ca-certificates
      - cmake
      - curl
      - libssl-dev
    override-build: |
      set -e
      SDK_VERSION=0.0.7
      SDK_URL="https://github.com/villagesql/villagesql-server/releases"
      SDK_URL="$SDK_URL/download/release%2F${SDK_VERSION}"
      SDK_URL="$SDK_URL/villagesql-extension-sdk-${SDK_VERSION}.tar.gz"
      rm -rf sdk build && mkdir -p sdk
      curl -fsSL "$SDK_URL" | tar xz -C sdk --strip-components=1
      cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
        -DVillageSQL_SDK_DIR="$PWD/sdk"
      cmake --build build
      tar -tf build/vsql_network_address.veb
      # Layout consumed by the villagesql snap, see docs/extensions.md.
      OUT="$CRAFT_PART_INSTALL/network-address"
      install -Dm644 build/vsql_network_address.veb "$OUT/veb/vsql_network_address.veb"
      printf 'VERSION=%s\n' "$CRAFT_PROJECT_VERSION" > "$OUT/manifest"
      install -Dm644 LICENSE "$OUT/licenses/LICENSE-villagesql-network-address"

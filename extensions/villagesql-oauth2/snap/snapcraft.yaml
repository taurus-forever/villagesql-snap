name: villagesql-oauth2
base: core26
version: '0.0.4'
summary: vsql_oauth2 extension for the VillageSQL snap (content interface)
description: |
  Packages the upstream vsql-oauth2 extension (JWT-based account
  authentication via OAuth2/OIDC (CREATE USER ... IDENTIFIED WITH
  vsql_oauth2)) as a separate snap that plugs into the villagesql snap
  through the content interface:

    sudo snap install villagesql-oauth2
    sudo snap connect villagesql:extensions villagesql-oauth2:extensions
    sudo snap set villagesql vsql-allow-preview-extensions=ON
    sudo snap restart villagesql
    sudo villagesql.mysql -uroot \
      -e "INSTALL EXTENSION vsql_oauth2; SELECT @@vsql_oauth2.jwks_refresh_interval;"

  Preview extension: it uses VEF APIs that may change between VillageSQL
  releases and only loads when the server runs with
  vsql_allow_preview_extensions=ON.
grade: devel
confinement: strict

platforms:
  amd64:
  arm64:
  riscv64:

slots:
  extensions:
    interface: content
    content: villagesql-extensions
    source:
      read:
        - $SNAP/oauth2

parts:
  oauth2:
    plugin: nil
    source: https://github.com/villagesql/vsql-oauth2.git
    source-tag: '0.0.4'
    source-depth: 1
    build-packages:
      - build-essential
      - ca-certificates
      - cmake
      - curl
      - libcurl4-openssl-dev
      - libssl-dev
    override-build: |
      set -e
      SDK_VERSION=0.0.7
      SDK_URL="https://github.com/villagesql/villagesql-server/releases"
      SDK_URL="$SDK_URL/download/release%2F${SDK_VERSION}"
      SDK_URL="$SDK_URL/villagesql-extension-sdk-${SDK_VERSION}.tar.gz"
      rm -rf sdk build && mkdir -p sdk
      curl -fsSL "$SDK_URL" | tar xz -C sdk --strip-components=1
      cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
        -DVillageSQL_SDK_DIR="$PWD/sdk"
      cmake --build build
      tar -tf build/vsql_oauth2.veb
      # Layout consumed by the villagesql snap, see docs/extensions.md.
      # libcurl is provided by the villagesql snap that loads the bundle.
      OUT="$CRAFT_PART_INSTALL/oauth2"
      install -Dm644 build/vsql_oauth2.veb "$OUT/veb/vsql_oauth2.veb"
      printf 'VERSION=%s\n' "$CRAFT_PROJECT_VERSION" > "$OUT/manifest"
      install -Dm644 LICENSE "$OUT/licenses/LICENSE-villagesql-oauth2"

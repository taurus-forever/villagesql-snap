name: villagesql-nanoid
base: core26
version: '0.0.1+git9b03e82'
summary: vsql_nanoid extension for the VillageSQL snap (content interface)
description: |
  Packages the upstream vsql-nanoid extension (URL-safe NanoID generation)
  as a separate snap that plugs into the villagesql snap through the content
  interface:

    sudo snap install villagesql-nanoid
    sudo snap connect villagesql:extensions villagesql-nanoid:extensions
    sudo snap restart villagesql
    sudo villagesql.mysql -uroot -e "INSTALL EXTENSION vsql_nanoid;"
    sudo villagesql.mysql -uroot \
      -e "SELECT vsql_nanoid.nanoid();"
grade: devel
confinement: strict

platforms:
  amd64:
  arm64:
  riscv64:

slots:
  extensions:
    interface: content
    content: villagesql-extensions
    source:
      read:
        - $SNAP/nanoid

parts:
  nanoid:
    plugin: nil
    source: https://github.com/intojhanurag/vsql-nanoid.git
    # The repository has no tags: pinned to the commit of 2026-10-21.
    source-commit: 9b03e8259bf79cca5a039cdd9f3116d869cad3fa
    build-packages:
      - build-essential
      - ca-certificates
      - cmake
      - curl
      - libssl-dev
    override-build: |
      set -e
      SDK_VERSION=0.0.7
      SDK_URL="https://github.com/villagesql/villagesql-server/releases"
      SDK_URL="$SDK_URL/download/release%2F${SDK_VERSION}"
      SDK_URL="$SDK_URL/villagesql-extension-sdk-${SDK_VERSION}.tar.gz"
      rm -rf sdk build && mkdir -p sdk
      curl -fsSL "$SDK_URL" | tar xz -C sdk --strip-components=1
      cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
        -DVillageSQL_SDK_DIR="$PWD/sdk"
      cmake --build build
      BUNDLE=vsql_nanoid
      tar -tf "build/$BUNDLE.veb"
      # Layout consumed by the villagesql snap, see docs/extensions.md.
      OUT="$CRAFT_PART_INSTALL/nanoid"
      install -Dm644 "build/$BUNDLE.veb" "$OUT/veb/$BUNDLE.veb"
      printf 'VERSION=%s\n' "$CRAFT_PROJECT_VERSION" > "$OUT/manifest"
      install -Dm644 LICENSE "$OUT/licenses/LICENSE-$CRAFT_PROJECT_NAME"

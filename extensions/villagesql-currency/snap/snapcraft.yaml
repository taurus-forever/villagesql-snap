name: villagesql-currency
base: core26
version: '0.0.1'
summary: vsql_currency extension for the VillageSQL snap (content interface)
description: |
  Packages the upstream vsql-currency extension (an ISO 4217 currency-code
  column type (Rust port of pg-currency)) as a separate snap that plugs into
  the villagesql snap through the content interface:

    sudo snap install villagesql-currency
    sudo snap connect villagesql:extensions villagesql-currency:extensions
    sudo snap restart villagesql
    sudo villagesql.mysql -uroot -e "INSTALL EXTENSION vsql_currency;"
    sudo villagesql.mysql -uroot \
      -e "SELECT vsql_currency.currency_count();"

  Written in Rust against the VillageSQL Rust SDK (crates.io) and packaged
  with cargo-vsql; no server build is needed.
grade: devel
confinement: strict

platforms:
  amd64:
  arm64:
  riscv64:

slots:
  extensions:
    interface: content
    content: villagesql-extensions
    source:
      read:
        - $SNAP/currency

parts:
  currency:
    plugin: nil
    source: https://github.com/villagesql/vsql-currency.git
    source-tag: '0.0.1'
    source-depth: 1
    build-snaps:
      - rustup
    build-packages:
      - build-essential
      - ca-certificates
      - libssl-dev
      - pkg-config
    override-build: |
      set -e
      rustup default stable
      cargo install cargo-vsql --locked --version 0.0.6
      # Release build; writes dist/vsql_currency.veb (manifest.json plus
      # lib/vsql_currency.so) without a server checkout.
      cargo vsql package
      tar -tf dist/vsql_currency.veb
      # Layout consumed by the villagesql snap, see docs/extensions.md.
      OUT="$CRAFT_PART_INSTALL/currency"
      install -Dm644 dist/vsql_currency.veb "$OUT/veb/vsql_currency.veb"
      printf 'VERSION=%s\n' "$CRAFT_PROJECT_VERSION" > "$OUT/manifest"
      install -Dm644 LICENSE "$OUT/licenses/LICENSE-villagesql-currency"

summary: Refresh from the previous release keeps data, service and connected extension snaps

execute: |
  MYSQL="villagesql.mysql -uroot -N"
  wait_ready() {
    timeout 90 /bin/bash -c \
      "while ! villagesql.mysqladmin -uroot ping >/dev/null 2>&1; do echo Waiting for villagesql...; sleep 1; done"
  }
  revision() { snap list villagesql | awk 'NR == 2 {print $3}'; }

  # Start FROM the previous release: local builds under spread/ when present
  # (spread/villagesql_*.snap plus the two example providers), otherwise the
  # store's edge channel of this branch's track (mysql-8.4 -> 8.4/edge), or
  # the store's default track (--edge, 9.7 today) should this branch's
  # track not exist yet. Both paths are a real refresh for snapd: new
  # revision, hooks, service stop/start. The previous release may come from
  # another codebase (0.0.6 local builds are mysql-8.4 on every branch, the
  # default track is mysql-9.7): the refresh must then be rolled back.
  ARCH="$(dpkg --print-architecture)"
  TRACK="${CODEBASE#mysql-}"
  PREV="$(ls "${PROJECT_PATH}"/spread/villagesql_*_"$ARCH".snap 2>/dev/null | head -1)"
  snap remove villagesql --purge --terminate
  if [ -n "$PREV" ]; then
    echo "Installing the previous local build $PREV..."
    snap install "$PREV" --dangerous --jailmode
  else
    echo "Installing the previous release from the store (${TRACK}/edge, else the default track)..."
    snap install villagesql --channel "${TRACK}/edge" || snap install villagesql --edge
  fi
  for provider in villagesql-hello villagesql-uuid; do
    LOCAL="$(ls "${PROJECT_PATH}"/spread/"$provider"_*_"$ARCH".snap 2>/dev/null | head -1)"
    if [ -n "$LOCAL" ]; then snap install "$LOCAL" --dangerous; else snap install "$provider" --edge; fi
  done

  # Store snaps only connect when the plug's and the slot's content labels
  # match: 0.0.6 used villagesql-8.4-extensions, 0.0.7 villagesql-extensions,
  # and the store's providers carry the new label. A 0.0.6 previous release
  # from the store (a track whose 0.0.7 is not published for this arch yet)
  # therefore gets its providers connected after the refresh instead.
  content_label() {
    awk -v section="$2:" '$0 == section {s=1; next} s && /^[^ ]/ {s=0} s && /^ +content: / {print $2; exit}' \
      "/snap/$1/current/meta/snap.yaml"
  }
  connect_providers() {
    snap connect villagesql:extensions villagesql-hello:extensions
    snap connect villagesql:extensions villagesql-uuid:extensions
    snap restart villagesql
    wait_ready
  }
  create_uuid_table() {
    villagesql.mysql -uroot -e "
      INSTALL EXTENSION vsql_uuid;
      CREATE TABLE refresh.u (id UUID PRIMARY KEY, name TEXT);
      INSERT INTO refresh.u VALUES (UUID_V7(), 'before');
    "
  }
  PLUG_LABEL="$(content_label villagesql plugs)"
  SLOT_LABEL="$(content_label villagesql-hello slots)"
  if [ "$PLUG_LABEL" = "$SLOT_LABEL" ]; then
    EXT_BEFORE=yes
    connect_providers
  else
    EXT_BEFORE=no
    echo "The previous release's plug label $PLUG_LABEL differs from the providers' slot label $SLOT_LABEL:" \
      "connecting the extension snaps after the refresh instead."
    wait_ready
  fi
  PREV_VERSION="$(snap list villagesql | awk 'NR == 2 {print $2}')"
  REV_BEFORE="$(revision)"
  snap connections villagesql
  # Codebase of the data the previous release initialised, as the guard
  # reads it (0.0.6 only wrote .snap-data-major=8.4, which means mysql-8.4).
  if [ -f /var/snap/villagesql/common/.snap-data-codebase ]; then
    PREV_CODEBASE="$(cat /var/snap/villagesql/common/.snap-data-codebase)"
  else
    grep -x "8.4" /var/snap/villagesql/common/.snap-data-major
    PREV_CODEBASE=mysql-8.4
  fi
  echo "Previous release: $PREV_VERSION ($PREV_CODEBASE), current build: ${CODEBASE}"

  echo "Creating test data and an account..."
  villagesql.mysql -uroot -e "
    CREATE DATABASE refresh;
    CREATE TABLE refresh.t (id INT AUTO_INCREMENT PRIMARY KEY, name TEXT);
    INSERT INTO refresh.t (name) VALUES ('test1');
    CREATE USER 'keep'@'%' IDENTIFIED BY 'keeppass';
  "
  if [ "$EXT_BEFORE" = yes ]; then
    echo "Creating a table with the UUID type from the connected provider..."
    create_uuid_table
  fi

  echo "Refreshing to the current build..."
  snap install "$CRAFT_ARTIFACT" --dangerous --jailmode > /tmp/refresh.log 2>&1 || true
  cat /tmp/refresh.log
  snap connections villagesql || true

  if [ "$PREV_CODEBASE" = "$CODEBASE" ]; then
    echo "Same codebase: the refresh must have succeeded..."
    grep -E "villagesql [0-9.]+-[0-9.+a-z]+ installed" /tmp/refresh.log
    test "$REV_BEFORE" != "$(revision)"
    wait_ready
    snap services villagesql | grep -E "villagesql.villagesql\s+enabled\s+active"

    echo "Ensure data, accounts and config survived..."
    $MYSQL -e "SELECT name FROM refresh.t;" | grep -x test1
    villagesql.mysql -uroot -e "INSERT INTO refresh.t (name) VALUES ('test2');"
    $MYSQL -e "SELECT name FROM refresh.t;" | grep -x test2
    $MYSQL -e "SELECT plugin FROM mysql.user WHERE user='root';" | grep -x auth_socket
    villagesql.mysql -ukeep -pkeeppass -h127.0.0.1 -N -e "SELECT 1;" | grep -x 1
    grep -x "${CODEBASE}" /var/snap/villagesql/common/.snap-data-codebase
    test ! -e /var/snap/villagesql/common/.snap-data-major

    if [ "$EXT_BEFORE" = no ]; then
      echo "Connecting the extension snaps to the new revision (labels match now)..."
      connect_providers
      create_uuid_table
    fi
    echo "Ensure the extension snaps are connected and working..."
    snap connections villagesql | grep -E "villagesql:extensions\s+villagesql-hello:extensions"
    snap connections villagesql | grep -E "villagesql:extensions\s+villagesql-uuid:extensions"
    villagesql.extensions list
    villagesql.extensions list | grep -E "^vsql_uuid\s+\S+\s+snap:uuid\s+yes$"
    $MYSQL -e "SELECT name FROM refresh.u;" | grep -x before
    villagesql.mysql -uroot -e "INSERT INTO refresh.u VALUES (UUID_V7(), 'after');"
    $MYSQL -e "SELECT COUNT(*) FROM refresh.u;" | grep -x 2
    $MYSQL -e "SELECT UUID_VERSION(UUID_V7());" | grep -x 7
  else
    echo "Other codebase: the refresh must have been rolled back..."
    grep -q "is from codebase ${PREV_CODEBASE} but this revision provides ${CODEBASE}" /tmp/refresh.log
    test "$REV_BEFORE" = "$(revision)"
    snap list villagesql | awk 'NR == 2 {print $2}' | grep -x "$PREV_VERSION"
    wait_ready
    $MYSQL -e "SELECT name FROM refresh.t;" | grep -x test1
    [ "$EXT_BEFORE" = no ] || $MYSQL -e "SELECT name FROM refresh.u;" | grep -x before
  fi

  echo "Test refresh completed."

restore: |
  snap remove villagesql-hello 2>/dev/null || true
  snap remove villagesql-uuid 2>/dev/null || true

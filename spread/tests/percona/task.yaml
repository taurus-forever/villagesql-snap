summary: Percona Server features match the upstream percona-8.4 page

execute: |
  MYSQL="villagesql.mysql -uroot -N"
  $MYSQL -e "SELECT @@villagesql_server_version;" | grep -x "percona-8.4_0.0.7"

  echo "Percona-only: backup locks..."
  $MYSQL -e "SELECT @@have_backup_locks;" | grep -x YES
  $MYSQL -e "LOCK TABLES FOR BACKUP; UNLOCK TABLES;"

  echo "Excluded by the VillageSQL Percona build: MyRocks..."
  $MYSQL -e "CREATE DATABASE p;"
  ! $MYSQL -e "CREATE TABLE p.r (id INT) ENGINE=ROCKSDB;" 2>/tmp/rocks.err
  cat /tmp/rocks.err; grep -qi "unknown storage engine" /tmp/rocks.err

  echo "Excluded by the VillageSQL Percona build: the KMIP keyring component..."
  ! $MYSQL -e "INSTALL COMPONENT 'file://component_keyring_kmip';" 2>/tmp/kmip.err
  cat /tmp/kmip.err; grep -q "1126" /tmp/kmip.err
